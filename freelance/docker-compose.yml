version: '2'
services:
  php:
    image: yiisoftware/yii2-php:8.1-apache
    depends_on:
      - mysql
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '8000:80'
    environment:
      - DB_HOST=mysql
      - DB_NAME=freelance
      - DB_USER=root
      - DB_PASSWORD=root

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: freelance
    volumes:
      - mysql-data:/var/lib/mysql
      - ./freelance.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '3307:3306'

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - '8085:80'
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql-data:
